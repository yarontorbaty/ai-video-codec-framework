AWSTemplateFormatVersion: '2010-09-09'
Description: 'PVC Research Infrastructure - DynamoDB Table'

Resources:
  PVCExperimentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ai-codec-pvc-experiments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: experiment_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: experiment_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: AiV1-PVC
        - Key: Environment
          Value: research

Outputs:
  TableName:
    Description: PVC Experiments DynamoDB Table
    Value: !Ref PVCExperimentsTable
    Export:
      Name: PVCExperimentsTable

  TableArn:
    Description: PVC Experiments Table ARN
    Value: !GetAtt PVCExperimentsTable.Arn
    Export:
      Name: PVCExperimentsTableArn

